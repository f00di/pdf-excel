[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-excel"
version = "0.1.0"
description = "Convert PDF tables into Excel workbooks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "PDF Excel contributors" }
]
keywords = ["pdf", "excel", "xlsx", "tables", "conversion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
ai = ["openai>=1.40"]
encrypted = ["msoffcrypto-tool>=5.4"]
ocr = ["PyMuPDF>=1.24", "pytesseract>=0.3.10", "Pillow>=10.4"]
xls = ["pandas>=2.2", "xlrd>=2.0"]
dev = ["pytest>=8.2"]

[project.scripts]
pdf-excel = "pdf_excel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
